<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Voyage Premium - Gestion des trajets</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body>

<div class="d-flex">
    <nav class="vp-sidebar p-3" style="width:260px;">
        <div class="text-center mb-4">
            <img src="../assets/logo.jpeg" class="vp-logo" style="width:110px; margin:0 auto;" alt="Voyage Premium">
        </div>
        <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="trajets.html" class="active"><i class="bi bi-signpost-2"></i> Gestion des trajets</a>
        <a href="vehicules.html"><i class="bi bi-car-front"></i> Gestion des vehicules</a>
        <a href="utilisateurs.html"><i class="bi bi-people"></i> Gestion des utilisateurs</a>
        <a href="reservations.html"><i class="bi bi-journal-check"></i> Places reservees</a>
        <button class="vp-btn vp-btn-orange w-100 mt-4" onclick="seDeconnecter()"><i class="bi bi-box-arrow-left"></i> Deconnexion</button>
    </nav>

    <main class="flex-fill p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="vp-title-green"><i class="bi bi-signpost-2-fill"></i> Trajets</h1>
            <button class="vp-btn vp-btn-green" data-bs-toggle="modal" data-bs-target="#modalTrajet" onclick="ouvrirAjout()"><i class="bi bi-plus-circle"></i> Ajouter un trajet</button>
        </div>

        <div class="vp-card">
            <table class="table vp-table align-middle">
                <thead><tr><th>Destination</th><th>Depart</th><th>Vehicule</th><th>Date</th><th>Heure</th><th>Prix</th><th>Statut</th><th>Actions</th></tr></thead>
                <tbody id="corpsTableau"></tbody>
            </table>
        </div>
    </main>
</div>

<!-- Modal Ajout/Modification -->
<div class="modal fade" id="modalTrajet" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content" style="border-radius:20px; font-family:'Baloo 2', sans-serif;">
      <div class="modal-header">
        <h5 class="modal-title" id="titreModal">Ajouter un trajet</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body d-flex flex-column gap-3">
        <input type="hidden" id="trajetId">
        <select class="vp-input" id="champDestination"></select>
        <div class="form-text mb-0" style="margin-top:-.6rem;">La liste des v&eacute;hicules ci-dessous ne montre que ceux d&eacute;di&eacute;s &agrave; cette destination.</div>
        <input type="text" class="vp-input" id="champLieuDepart" placeholder="Lieu de depart" value="Antananarivo">
        <select class="vp-input" id="champVehicule"></select>
        <label class="fw-bold">Date de d&eacute;part (fix&eacute;e par l'admin)</label>
        <input type="date" class="vp-input" id="champDate">
        <label class="fw-bold">Heure de d&eacute;part (fix&eacute;e par l'admin)</label>
        <input type="time" class="vp-input" id="champHeure">
        <input type="number" class="vp-input" id="champPrix" placeholder="Prix (Ar)">
        <select class="vp-input" id="champStatut">
            <option value="Actif">Actif</option>
            <option value="Termine">Terminé</option>
            <option value="Annule">Annulé</option>
        </select>
      </div>
      <div class="modal-footer">
        <button class="vp-btn vp-btn-yellow" onclick="enregistrerTrajet()"><i class="bi bi-check-lg"></i> Enregistrer</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/admin.js"></script>
<script>
exigerAdmin();
let modeEdition = false;
let vehiculesDisponibles = [];

async function chargerVehiculesSelect(){
    vehiculesDisponibles = await appelApi('/vehicules', 'GET', null, false);

    const destinations = [...new Set(vehiculesDisponibles.map(v => v.destination))].sort();
    const selectDestination = document.getElementById('champDestination');
    selectDestination.innerHTML = destinations.length
        ? destinations.map(d => `<option value="${d}">${d}</option>`).join('')
        : '<option value="">Aucun v&eacute;hicule disponible - creez-en un dans "Gestion des vehicules"</option>';

    selectDestination.addEventListener('change', () => filtrerVehiculesParDestination(selectDestination.value));
    filtrerVehiculesParDestination(selectDestination.value);
}

function filtrerVehiculesParDestination(destination){
    const correspondants = vehiculesDisponibles.filter(v => v.destination === destination);
    document.getElementById('champVehicule').innerHTML = correspondants.length
        ? correspondants.map(v => `<option value="${v.id}">${v.nom} (${v.type})</option>`).join('')
        : '<option value="">Aucun v&eacute;hicule dedie a cette destination</option>';
}

async function chargerTrajets(){
    try {
        const trajets = await appelApi('/trajets', 'GET', null, false);
        document.getElementById('corpsTableau').innerHTML = trajets.map(t => `
            <tr>
                <td>${t.destination}</td>
                <td>${t.lieu_depart}</td>
                <td>${t.vehicule_nom} <span class="${t.vehicule_type === 'Premium' ? 'vp-badge-premium' : 'vp-badge-standard'}">${t.vehicule_type}</span></td>
                <td>${formaterDate(t.date_depart)}</td>
                <td>${t.heure_depart ? t.heure_depart.slice(0,5) : ''}</td>
                <td>${Number(t.prix).toLocaleString('fr-FR')} Ar</td>
                <td>${t.statut}</td>
                <td>
                    <button class="vp-btn vp-btn-pink" style="padding:.3rem 1rem; font-size:.85rem;" data-bs-toggle="modal" data-bs-target="#modalTrajet"
                        onclick='ouvrirModification(${JSON.stringify(t)})'><i class="bi bi-pencil-square"></i> Modifier</button>
                    <button class="vp-btn vp-btn-orange" style="padding:.3rem 1rem; font-size:.85rem;" onclick="supprimerTrajet(${t.id})"><i class="bi bi-trash3"></i> Supprimer</button>
                </td>
            </tr>
        `).join('');
    } catch (erreur) {
        afficherMessage(erreur.message, 'danger');
    }
}

function ouvrirAjout(){
    modeEdition = false;
    document.getElementById('titreModal').textContent = 'Ajouter un trajet';
    document.getElementById('trajetId').value = '';
    if(document.getElementById('champDestination').options.length){
        document.getElementById('champDestination').selectedIndex = 0;
        filtrerVehiculesParDestination(document.getElementById('champDestination').value);
    }
    document.getElementById('champLieuDepart').value = 'Antananarivo';
    document.getElementById('champDate').value = '';
    document.getElementById('champHeure').value = '';
    document.getElementById('champPrix').value = '';
    document.getElementById('champStatut').value = 'Actif';
}

function ouvrirModification(t){
    modeEdition = true;
    document.getElementById('titreModal').textContent = 'Modifier le trajet';
    document.getElementById('trajetId').value = t.id;
    document.getElementById('champDestination').value = t.destination;
    filtrerVehiculesParDestination(t.destination);
    document.getElementById('champLieuDepart').value = t.lieu_depart;
    document.getElementById('champVehicule').value = t.vehicule_id;
    document.getElementById('champDate').value = t.date_depart ? t.date_depart.slice(0,10) : '';
    document.getElementById('champHeure').value = t.heure_depart ? t.heure_depart.slice(0,5) : '';
    document.getElementById('champPrix').value = t.prix;
    document.getElementById('champStatut').value = t.statut;
}

async function enregistrerTrajet(){
    const id = document.getElementById('trajetId').value;
    const corps = {
        destination: document.getElementById('champDestination').value.trim(),
        lieu_depart: document.getElementById('champLieuDepart').value.trim(),
        vehicule_id: parseInt(document.getElementById('champVehicule').value, 10),
        date_depart: document.getElementById('champDate').value,
        heure_depart: document.getElementById('champHeure').value,
        prix: parseFloat(document.getElementById('champPrix').value) || 0,
        statut: document.getElementById('champStatut').value
    };

    try {
        if(modeEdition){
            await appelApi(`/trajets/${id}`, 'PUT', corps);
        } else {
            await appelApi('/trajets', 'POST', corps);
        }
        afficherMessage('Trajet enregistre.');
        bootstrap.Modal.getInstance(document.getElementById('modalTrajet')).hide();
        chargerTrajets();
    } catch (erreur) {
        afficherMessage(erreur.message, 'danger');
    }
}

async function supprimerTrajet(id){
    if(!confirm('Supprimer ce trajet ?')) return;
    try {
        await appelApi(`/trajets/${id}`, 'DELETE');
        afficherMessage('Trajet supprime.');
        chargerTrajets();
    } catch (erreur) {
        afficherMessage(erreur.message, 'danger');
    }
}

(async () => {
    await chargerVehiculesSelect();
    chargerTrajets();
})();
</script>
</body>
</html>
