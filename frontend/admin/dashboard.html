<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Voyage Premium - Dashboard Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body>

<div class="d-flex">
    <!-- ===== Barre laterale ===== -->
    <nav class="vp-sidebar p-3" style="width:260px;">
        <div class="text-center mb-4">
            <img src="../assets/logo.jpeg" class="vp-logo" style="width:110px; margin:0 auto;" alt="Voyage Premium">
        </div>
        <a href="dashboard.html" class="active"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="trajets.html"><i class="bi bi-signpost-2"></i> Gestion des trajets</a>
        <a href="vehicules.html"><i class="bi bi-car-front"></i> Gestion des vehicules</a>
        <a href="utilisateurs.html"><i class="bi bi-people"></i> Gestion des utilisateurs</a>
        <a href="reservations.html"><i class="bi bi-journal-check"></i> Places reservees</a>
        <button class="vp-btn vp-btn-orange w-100 mt-4" onclick="seDeconnecter()"><i class="bi bi-box-arrow-left"></i> Deconnexion</button>
    </nav>

    <!-- ===== Contenu principal ===== -->
    <main class="flex-fill p-4">
        <h1 class="vp-title-green mb-4"><i class="bi bi-speedometer2"></i> Tableau de bord</h1>

        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="vp-stat-card">
                    <div class="vp-stat-value" id="statUtilisateurs">-</div>
                    <div class="vp-stat-label"><i class="bi bi-people-fill"></i> Clients</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="vp-stat-card">
                    <div class="vp-stat-value" id="statVehicules">-</div>
                    <div class="vp-stat-label"><i class="bi bi-car-front-fill"></i> V&eacute;hicules</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="vp-stat-card">
                    <div class="vp-stat-value" id="statTrajets">-</div>
                    <div class="vp-stat-label"><i class="bi bi-signpost-2-fill"></i> Trajets</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="vp-stat-card">
                    <div class="vp-stat-value" id="statReservations">-</div>
                    <div class="vp-stat-label"><i class="bi bi-journal-check"></i> R&eacute;servations</div>
                </div>
            </div>
        </div>

        <div class="vp-card">
            <div style="font-weight:700; color:var(--text-dark); font-size:1.15rem;" class="mb-3"><i class="bi bi-list-ul"></i> Dernieres reservations</div>
            <table class="table vp-table">
                <thead><tr><th>Client</th><th>Destination</th><th>Sieges</th><th>Date</th></tr></thead>
                <tbody id="corpsTableau"></tbody>
            </table>
        </div>
    </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/admin.js"></script>
<script>
    exigerAdmin();

    async function chargerDashboard(){
        try {
            const d = await appelApi('/admin/dashboard');
            document.getElementById('statUtilisateurs').textContent = d.total_utilisateurs;
            document.getElementById('statVehicules').textContent = d.total_vehicules;
            document.getElementById('statTrajets').textContent = d.total_trajets;
            document.getElementById('statReservations').textContent = d.total_reservations;

            document.getElementById('corpsTableau').innerHTML = d.dernieresReservations.map(r => `
                <tr>
                    <td>${r.nom} ${r.prenom}</td>
                    <td>${r.destination}</td>
                    <td>${r.nombre_siege}</td>
                    <td>${new Date(r.date_reservation).toLocaleString('fr-FR')}</td>
                </tr>
            `).join('');
        } catch (erreur) {
            afficherMessage(erreur.message, 'danger');
        }
    }
    chargerDashboard();
</script>
</body>
</html>
