<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Voyage Premium - Gestion des utilisateurs</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body>

<div class="d-flex">
    <nav class="vp-sidebar p-3" style="width:260px;">
        <div class="text-center mb-4">
            <img src="../assets/logo.jpeg" class="vp-logo" style="width:110px; margin:0 auto;" alt="Voyage Premium">
        </div>
        <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="trajets.html"><i class="bi bi-signpost-2"></i> Gestion des trajets</a>
        <a href="vehicules.html"><i class="bi bi-car-front"></i> Gestion des vehicules</a>
        <a href="utilisateurs.html" class="active"><i class="bi bi-people"></i> Gestion des utilisateurs</a>
        <a href="reservations.html"><i class="bi bi-journal-check"></i> Places reservees</a>
        <button class="vp-btn vp-btn-orange w-100 mt-4" onclick="seDeconnecter()"><i class="bi bi-box-arrow-left"></i> Deconnexion</button>
    </nav>

    <main class="flex-fill p-4">
        <h1 class="vp-title-green mb-4"><i class="bi bi-people-fill"></i> Utilisateurs</h1>

        <div class="vp-card">
            <table class="table vp-table align-middle">
                <thead><tr><th>Nom</th><th>Email</th><th>T&eacute;l&eacute;phone</th><th>Sexe</th><th>Inscrit le</th><th>Actions</th></tr></thead>
                <tbody id="corpsTableau"></tbody>
            </table>
        </div>
    </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/admin.js"></script>
<script>
exigerAdmin();

async function chargerUtilisateurs(){
    try {
        const utilisateurs = await appelApi('/admin/utilisateurs');
        document.getElementById('corpsTableau').innerHTML = utilisateurs
            .filter(u => u.role === 'client')
            .map(u => `
                <tr>
                    <td>${u.nom} ${u.prenom}</td>
                    <td>${u.email}</td>
                    <td>${u.telephone || '-'}</td>
                    <td>${u.sexe}</td>
                    <td>${formaterDate(u.date_creation)}</td>
                    <td><button class="vp-btn vp-btn-orange" style="padding:.3rem 1rem; font-size:.85rem;" onclick="supprimerUtilisateur(${u.id})"><i class="bi bi-trash3"></i> Supprimer</button></td>
                </tr>
            `).join('');
    } catch (erreur) {
        afficherMessage(erreur.message, 'danger');
    }
}

async function supprimerUtilisateur(id){
    if(!confirm('Supprimer ce client ?')) return;
    try {
        await appelApi(`/admin/utilisateurs/${id}`, 'DELETE');
        afficherMessage('Utilisateur supprime.');
        chargerUtilisateurs();
    } catch (erreur) {
        afficherMessage(erreur.message, 'danger');
    }
}

chargerUtilisateurs();
</script>
</body>
</html>
