<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Voyage Premium - Reservations</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body>

<div class="d-flex">
    <nav class="vp-sidebar p-3" style="width:260px;">
        <div class="text-center mb-4">
            <img src="../assets/logo.jpeg" class="vp-logo" style="width:110px; margin:0 auto;" alt="Voyage Premium">
        </div>
        <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="trajets.html"><i class="bi bi-signpost-2"></i> Gestion des trajets</a>
        <a href="vehicules.html"><i class="bi bi-car-front"></i> Gestion des vehicules</a>
        <a href="utilisateurs.html"><i class="bi bi-people"></i> Gestion des utilisateurs</a>
        <a href="reservations.html" class="active"><i class="bi bi-journal-check"></i> Places reservees</a>
        <button class="vp-btn vp-btn-orange w-100 mt-4" onclick="seDeconnecter()"><i class="bi bi-box-arrow-left"></i> Deconnexion</button>
    </nav>

    <main class="flex-fill p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="vp-title-green"><i class="bi bi-journal-check"></i> Places r&eacute;serv&eacute;es par les clients</h1>
        </div>

        <div class="vp-card">
            <table class="table vp-table align-middle">
                <thead>
                    <tr>
                        <th>Client</th>
                        <th>Email</th>
                        <th>T&eacute;l&eacute;phone</th>
                        <th>Destination</th>
                        <th>V&eacute;hicule</th>
                        <th>Date</th>
                        <th>Si&egrave;ges r&eacute;serv&eacute;s</th>
                        <th>Statut</th>
                    </tr>
                </thead>
                <tbody id="corpsTableau"></tbody>
            </table>
        </div>
    </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/admin.js"></script>
<script>
exigerAdmin();

async function chargerReservations(){
    try {
        const reservations = await appelApi('/reservations');

        if(reservations.length === 0){
            document.getElementById('corpsTableau').innerHTML =
                '<tr><td colspan="8" class="text-center">Aucune reservation pour le moment.</td></tr>';
            return;
        }

        document.getElementById('corpsTableau').innerHTML = reservations.map(r => `
            <tr>
                <td>${r.nom} ${r.prenom}</td>
                <td>${r.email || '-'}</td>
                <td>${r.telephone || '-'}</td>
                <td>${r.destination || '-'}</td>
                <td>${r.vehicule_nom ? `${r.vehicule_nom} <span class="${r.vehicule_type === 'Premium' ? 'vp-badge-premium' : 'vp-badge-standard'}">${r.vehicule_type}</span>` : '-'}</td>
                <td>${formaterDate(r.date_depart)} ${r.heure_depart ? r.heure_depart.slice(0,5) : ''}</td>
                <td>${r.numeros_sieges || '-'}</td>
                <td>${r.statut === 'Confirmee' ? '<span class="vp-badge-premium">Confirm&eacute;e</span>' : '<span class="vp-badge-standard">Annul&eacute;e</span>'}</td>
            </tr>
        `).join('');
    } catch (erreur) {
        afficherMessage(erreur.message, 'danger');
    }
}

chargerReservations();
</script>
</body>
</html>
