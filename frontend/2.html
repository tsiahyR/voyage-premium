<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voyage Premium - Connexion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<button class="vp-btn vp-btn-orange position-absolute" style="top:20px; left:20px;" onclick="window.location.href='1.html'"><i class="bi bi-arrow-left"></i> Retour</button>

<div class="container d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div style="width:100%; max-width:430px;">

    <div class="text-center mb-4">
        <img src="assets/logo.jpeg" class="vp-logo" style="width:110px; margin:0 auto;" alt="Voyage Premium">
    </div>

    <!-- ============ FORMULAIRE CONNEXION ============ -->
    <form id="formConnexion" class="d-flex flex-column gap-3">
        <input type="email" class="vp-input" id="emailConnexion" placeholder="Email:" required>
        <input type="password" class="vp-input" id="motDePasseConnexion" placeholder="Mot de passe:" required>

        <div class="text-end">
            <button type="button" class="vp-link" onclick="basculerFormulaire('inscription')">Creer une compte</button>
        </div>

        <div class="text-center mt-2">
            <button type="submit" class="vp-btn vp-btn-yellow"><i class="bi bi-box-arrow-in-right"></i> Connexion</button>
        </div>
    </form>

    <!-- ============ FORMULAIRE INSCRIPTION (cache par defaut) ============ -->
    <form id="formInscription" class="d-flex flex-column gap-3 d-none">
        <input type="text" class="vp-input" id="nomInscription" placeholder="Nom:" required>
        <input type="text" class="vp-input" id="prenomInscription" placeholder="Prenom:" required>
        <input type="email" class="vp-input" id="emailInscription" placeholder="Email:" required>
        <input type="password" class="vp-input" id="motDePasseInscription" placeholder="Mot de passe:" required>
        <input type="tel" class="vp-input" id="telephoneInscription" placeholder="Telephone:" required>
        <select class="vp-input" id="sexeInscription">
            <option value="Homme">Homme</option>
            <option value="Femme">Femme</option>
        </select>

        <div class="text-end">
            <button type="button" class="vp-link" onclick="basculerFormulaire('connexion')">J'ai deja un compte</button>
        </div>

        <div class="text-center mt-2">
            <button type="submit" class="vp-btn vp-btn-yellow"><i class="bi bi-person-plus-fill"></i> S'inscrire</button>
        </div>
    </form>

  </div>
</div>

<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
