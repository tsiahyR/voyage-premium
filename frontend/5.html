<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Voyage Premium - Reservation</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="container" style="min-height:100vh; padding:1.5rem 2rem;">

    <div class="d-flex justify-content-between align-items-start mb-4">
        <h1 class="vp-page-title"><i class="bi bi-journal-check"></i> Reservation</h1>
        <img src="assets/logo.jpeg" class="vp-logo" alt="Voyage Premium">
    </div>

    <div id="infoTrajet" class="mb-4 text-center" style="font-weight:700; color:#1c5d3a;"></div>

    <form id="formReservation" class="row gy-3">
        <div class="col-md-6">
            <input type="text" class="vp-input" id="nom" placeholder="Nom:" required>
        </div>
        <div class="col-md-6">
            <input type="time" class="vp-input" id="heure" readonly>
        </div>

        <div class="col-md-6">
            <input type="text" class="vp-input" id="prenom" placeholder="Prenom:" required>
        </div>
        <div class="col-md-6">
            <input type="date" class="vp-input" id="date" readonly>
        </div>

        <div class="col-md-6">
            <select class="vp-input" id="sexe">
                <option value="Homme">Sexe: Homme</option>
                <option value="Femme">Sexe: Femme</option>
            </select>
        </div>
        <div class="col-md-6">
            <input type="text" class="vp-input" id="lieuDepart" readonly>
        </div>

        <div class="col-md-6">
            <input type="tel" class="vp-input" id="telephone" placeholder="Telephone:" required>
        </div>
        <div class="col-md-6">
            <input type="number" class="vp-input" id="nombreSiege" min="1" placeholder="Nombre de siege:" required>
        </div>
    </form>

    <div class="d-flex justify-content-between mt-5">
        <button class="vp-btn vp-btn-orange" onclick="window.location.href='4.html'">&larr; Retour</button>
        <button class="vp-btn vp-btn-orange" id="btnSuivant">Suivant &rarr;</button>
    </div>

</div>

<script src="js/api.js"></script>
<script src="js/reservation-form.js"></script>
</body>
</html>
